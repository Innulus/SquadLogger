<!DOCTYPE html>
<html lang="en" 
      x-data="{ darkMode: localStorage.getItem('theme') === 'dark' }" 
      x-init="$watch('darkMode', val => localStorage.setItem('theme', val ? 'dark' : 'light'))"
      :class="darkMode ? 'dark' : ''">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CORE_OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { zinc: { 950: '#09090b' } } } }
        }
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

        /* RECTANGULAR GLASS SLABS (Inputs) */
        .glass-slab {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        .dark .glass-slab {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-slab:focus-within {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.1);
        }

        /* LIQUID GLASS BUBBLE (Primary Button) */
        .liquid-bubble {
            position: relative;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.8) 0%, rgba(37, 99, 235, 0.9) 100%);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3),
                        inset 0 12px 10px -10px rgba(255, 255, 255, 0.6),
                        inset 0 -10px 10px -5px rgba(0, 0, 0, 0.2);
        }
        .liquid-bubble:hover {
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 15px 25px rgba(37, 99, 235, 0.4);
        }
        .liquid-bubble::after {
            content: ''; position: absolute; top: 4px; left: 15%; width: 30%; height: 20%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-slate-300 dark:bg-zinc-950 text-gray-800 dark:text-zinc-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div class="max-w-md w-full bg-white/40 dark:bg-white/5 backdrop-blur-md p-10 rounded-[2.5rem] border border-white/30 dark:border-white/10 shadow-2xl">
        
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black tracking-tighter uppercase italic text-slate-900 dark:text-white">
                Spine<span class="text-blue-600 underline decoration-wavy underline-offset-4">V1</span>
            </h1>
        </div>
        {% if google_login == "True" %}
        <button class="w-full glass-slab py-3 px-4 rounded-xl flex items-center justify-center gap-3 font-bold text-xs uppercase tracking-widest hover:bg-white/50 dark:hover:bg-white/10 transition-all mb-8">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Login with Google
        </button>
        {% endif %}
        {% if discord_login == "True" %}
        <button class="w-full glass-slab py-3 px-4 rounded-xl flex items-center justify-center gap-3 font-bold text-xs uppercase tracking-widest hover:bg-white/50 dark:hover:bg-white/10 transition-all mb-8">
            <svg class="w-5 h-5 text-[#5865F2]" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.862-1.307 1.195-2.016a.076.076 0 0 0-.041-.105 13.021 13.021 0 0 1-1.872-.89.077.077 0 0 1-.008-.128c.125-.094.252-.192.37-.29a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.196.373.29a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.874.89.076.076 0 0 0-.041.106c.333.709.732 1.386 1.195 2.015a.078.078 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.419 0 1.334-.947 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.419 0 1.334-.946 2.419-2.157 2.419z"/>
            </svg>
            Login with Discord
        </button>
        {% endif %}
        <div class="relative flex items-center mb-8">
            <div class="flex-grow border-t border-slate-400/30"></div>
            <span class="flex-shrink mx-4 text-slate-500 dark:text-zinc-600 text-[10px] font-black uppercase tracking-[0.3em]">Login</span>
            <div class="flex-grow border-t border-slate-400/30"></div>
        </div>

        <div id="error-message"></div>

        <form hx-post="/login" 
              hx-target="#error-message" 
              hx-swap="innerHTML"
              class="space-y-6">
            
            <div class="space-y-2">
                <label class="block text-[10px] font-black text-slate-500 dark:text-zinc-500 uppercase tracking-widest ml-1">Username</label>
                <input type="text" name="username" required
                       class="w-full glass-slab px-4 py-3 rounded-xl outline-none text-sm mono placeholder-slate-400 dark:placeholder-zinc-700"
                       placeholder="johndoe1">
            </div>

            <div class="space-y-2">
                <label class="block text-[10px] font-black text-slate-500 dark:text-zinc-500 uppercase tracking-widest ml-1">Password</label>
                <input type="password" name="password" required
                       class="w-full glass-slab px-4 py-3 rounded-xl outline-none text-sm mono placeholder-slate-400 dark:placeholder-zinc-700"
                       placeholder="••••••••">
            </div>

            <button type="submit" 
                    class="liquid-bubble w-full text-white font-black py-3.5 rounded-full uppercase text-xs tracking-[0.3em] shadow-lg mt-4">
                Login
            </button>
        </form>

        <div class="mt-10 text-center">
            <p class="text-[10px] font-bold text-slate-500 dark:text-zinc-600 uppercase tracking-widest">
                No account? 
                <a href="/register" class="text-blue-600 hover:underline ml-1">Register</a>
            </p>
        </div>
    </div>

    <button @click="darkMode = !darkMode" 
            class="fixed bottom-6 right-6 w-12 h-12 flex items-center justify-center rounded-full bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md border border-white/20 shadow-xl transition-all active:scale-90 text-slate-600 dark:text-yellow-400">
        <svg x-show="!darkMode" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l.707.707M6.343 6.343l.707.707M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <svg x-show="darkMode" x-cloak class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
    </button>

</body>
</html>
