<tr id="user-row-{{ user.id }}" class="hover:bg-white/20 dark:hover:bg-white/5 transition-colors animate-in fade-in duration-300">
    <td class="py-4 px-6 align-middle">
        <div class="font-bold text-slate-900 dark:text-white">{{ user.username }}</div>
        <div class="text-xs text-slate-500 dark:text-zinc-400 mono">{{ user.email }}</div>
    </td>
    
    <td class="py-4 px-6 align-middle">
        {% if user.permissions == "Admin" %}
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-purple-500/10 text-purple-600 dark:text-purple-400 border border-purple-500/20 mono">
                Admin
            </span>
        {% else %}
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-slate-500/10 text-slate-600 dark:text-zinc-400 border border-slate-500/10 mono">
                User
            </span>
        {% endif %}
    </td>
    
    <td class="py-4 px-6 text-slate-600 dark:text-zinc-400 mono text-xs align-middle">
        {{ user.created_at }}
    </td>
    
    <td class="py-4 px-6 text-right whitespace-nowrap align-middle">
        <div class="inline-flex items-center gap-2">
            <button hx-get="/dashboard/users/edit/{{ user.id }}" 
                    hx-target="#user-row-{{ user.id }}"
                    hx-swap="outerHTML"
                    class="glass-bubble p-2 text-slate-500 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
                    title="Edit Profile">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
            </button>
            
            {% if user_can_delete_self or user.id != current_user %}
            <button hx-delete="/dashboard/users/delete/{{ user.id }}"
                    hx-target="#main-content"
                    hx-confirm="Are you sure you want to completely de-provision user profile: {{ user.username }}?"
                    class="glass-bubble p-2 text-slate-500 hover:text-red-500 transition-colors"
                    title="Delete User">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
            </button>
            {% endif %}
        </div>
    </td>
</tr>
