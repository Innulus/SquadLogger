<div class="p-8 bg-slate-200/50 dark:bg-zinc-900/50 backdrop-blur-xl border border-blue-500/30 dark:border-blue-500/20 rounded-[2rem] shadow-xl animate-in slide-in-from-top-4 duration-300">
    <div class="flex items-center gap-2 mb-6">
        <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
        <h3 class="text-sm font-black uppercase tracking-widest text-blue-600 dark:text-blue-400 mono">Provision New User</h3>
    </div>

    <form hx-post="/dashboard/users/create" 
          hx-target="#main-content"
          class="grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <div>
            <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500 dark:text-zinc-500 mb-2 mono">Username</label>
            <input type="text" name="username" required autocomplete="off"
                   class="glass-input w-full px-5 py-3 rounded-2xl font-bold text-sm border-white/20 dark:border-white/5"
                   placeholder="e.g. m_smith">
        </div>

        <div>
            <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500 dark:text-zinc-500 mb-2 mono">Email Address</label>
            <input type="email" name="email" required autocomplete="off"
                   class="glass-input w-full px-5 py-3 rounded-2xl font-bold text-sm border-white/20 dark:border-white/5"
                   placeholder="msmith@example.com">
        </div>

        <div>
            <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500 dark:text-zinc-500 mb-2 mono">Permission Level</label>
            <select name="permission" required
                    class="glass-input w-full px-5 py-3 rounded-2xl font-bold text-sm border-white/20 dark:border-white/5 appearance-none">
                <option value="User">Standard User</option>
                <option value="Admin">Administrator</option>
            </select>
        </div>

        <div>
            <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500 dark:text-zinc-500 mb-2 mono">Access Password</label>
            <input type="password" name="password" required
                   class="glass-input w-full px-5 py-3 rounded-2xl font-bold text-sm border-white/20 dark:border-white/5">
        </div>

        <div class="md:col-span-4 flex items-center justify-end gap-3 mt-2">
            <button type="button" 
                    onclick="document.getElementById('user-form-container').innerHTML = ''"
                    class="px-6 py-3 rounded-2xl font-bold text-xs uppercase tracking-widest text-slate-500 hover:bg-slate-300/50 dark:hover:bg-white/5 transition-all">
                Cancel
            </button>
            
            <button type="submit" 
                    class="tab-active px-8 py-3 rounded-2xl font-black text-xs uppercase tracking-[0.15em]">
                Confirm Provisioning
            </button>
        </div>
    </form>
</div>
