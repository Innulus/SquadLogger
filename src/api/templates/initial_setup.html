<!DOCTYPE html>
<html lang="en" 
      x-data="{ 
        darkMode: localStorage.getItem('theme') === 'dark',
        masterAppKey: '',
        password: '',
        confirmPassword: '',
        get isValid() { 
            return this.masterAppKey && this.password && this.confirmPassword && (this.password === this.confirmPassword); 
        }
      }" 
      x-init="$watch('darkMode', val => localStorage.setItem('theme', val ? 'dark' : 'light'))"
      :class="darkMode ? 'dark' : ''">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine V1 | Admin Initial Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: { 950: '#09090b' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

        /* LIQUID GLASS BUBBLE FORM ELEMENTS */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }
        .dark .glass-panel {
            background: rgba(9, 9, 11, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .dark .glass-input {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .tab-active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.8) 0%, rgba(37, 99, 235, 0.9) 100%) !important;
            color: white !important;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2),
                        inset 0 12px 10px -10px rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }
        .tab-active:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body class="bg-slate-300 dark:bg-zinc-950 text-gray-800 dark:text-zinc-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300 antialiased">

    <div class="absolute w-[600px] h-[600px] bg-blue-500/10 blur-[150px] rounded-full pointer-events-none"></div>

    <div class="glass-panel max-w-md w-full p-8 rounded-[2.5rem] relative z-10 border">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-blue-500/30 bg-blue-500/10 text-blue-600 dark:text-blue-400 mb-4">
                <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
                <span class="text-[9px] font-black uppercase tracking-widest mono">First-Time Setup</span>
            </div>
            <h1 class="text-3xl font-black uppercase tracking-tighter italic">
                Spine<span class="text-blue-600 underline decoration-wavy underline-offset-4">Admin</span> Setup
            </h1>
            <p class="text-xs text-slate-600 dark:text-zinc-400 mono mt-2">
                No administrator accounts found. Please enter your application security key to create the primary administrator profile.
            </p>
        </div>

        <div id="setup-error" class="hidden mb-6 p-4 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-500 text-xs font-bold mono text-center"></div>

        <form hx-post="/initial-setup" 
              hx-target="#setup-error" 
              hx-swap="innerHTML"
              class="space-y-5">
            
            <div>
                <label class="block text-[10px] font-black uppercase tracking-wider text-blue-600 dark:text-blue-400 mb-2 mono">
                    🔒 Application Security Key
                </label>
                <input type="password" name="master_app_key" x-model="masterAppKey" required autocomplete="off"
                       class="glass-input w-full px-5 py-3.5 rounded-2xl font-bold text-sm tracking-wide border-blue-500/30 dark:border-blue-500/20"
                       placeholder="Enter your system setup key">
            </div>

            <div class="border-t border-slate-400/20 dark:border-zinc-800 my-4"></div>

            <div>
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500 dark:text-zinc-500 mb-2 mono">Username</label>
                <input type="text" name="username" required autocomplete="off"
                       class="glass-input w-full px-5 py-3.5 rounded-2xl font-bold text-sm tracking-wide"
                       placeholder="admin">
            </div>

            <div>
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500 dark:text-zinc-500 mb-2 mono">Email Address</label>
                <input type="email" name="email" required autocomplete="off"
                       class="glass-input w-full px-5 py-3.5 rounded-2xl font-bold text-sm tracking-wide"
                       placeholder="admin@example.com">
            </div>

            <div>
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500 dark:text-zinc-500 mb-2 mono">Password</label>
                <input type="password" name="password" x-model="password" required
                       class="glass-input w-full px-5 py-3.5 rounded-2xl font-bold text-sm tracking-wide">
            </div>

            <div>
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500 dark:text-zinc-500 mb-2 mono">Confirm Password</label>
                <input type="password" x-model="confirmPassword" required
                       class="glass-input w-full px-5 py-3.5 rounded-2xl font-bold text-sm tracking-wide">
                
                <div class="mt-2 min-h-[16px]">
                    <p x-show="confirmPassword && password !== confirmPassword" x-cloak
                       class="text-[10px] text-red-500 font-bold mono">
                        ⚠️ Passwords do not match.
                    </p>
                </div>
            </div>

            <button type="submit" 
                    :disabled="!isValid"
                    class="tab-active w-full py-4 rounded-2xl font-black text-xs uppercase tracking-[0.2em] active:scale-[0.98] mt-2">
                Create Admin Account
            </button>
        </form>
    </div>

    <button @click="darkMode = !darkMode" 
            class="glass-panel fixed bottom-8 right-8 w-14 h-14 flex items-center justify-center text-slate-600 dark:text-yellow-400 rounded-full transition-all active:scale-90 border"
            aria-label="Toggle Theme">
        <svg x-show="!darkMode" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l.707.707M6.343 6.343l.707.707M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <svg x-show="darkMode" x-cloak class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
    </button>

    <script>
        document.body.addEventListener('htmx:responseError', function(evt) {
            const errorDiv = document.getElementById('setup-error');
            errorDiv.innerHTML = evt.detail.xhr.responseText || "An error occurred during setup.";
            errorDiv.classList.remove('hidden');
        });
    </script>
</body>
</html>
