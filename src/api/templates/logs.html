<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punishment Logs</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .form-group { margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        input { padding: 5px; }
    </style>
</head>
<body hx-headers='{"Authorization": "Bearer YOUR_ENV_SECRET_CODE"}'>

    <h2>Add New Punishment Log</h2>
    
    <form 
        hx-post="/logs/" 
        hx-target="#log-table-body" 
        hx-swap="afterbegin"
        hx-on::after-request="this.reset()"
    >
        <!-- Required Fields -->
        <div class="form-group">
            <input type="text" name="username" placeholder="Username" required>
            <input type="text" name="steam_id" placeholder="SteamID" required>
            <input type="number" name="punishment_duration" placeholder="Duration (Minutes)" required>
            <input type="text" name="server_name" placeholder="Server Name" required>
        </div>
        
        <!-- Optional Fields -->
        <div class="form-group">
            <input type="text" name="reason_given" placeholder="Reason (Optional)" style="width: 200px;">
            <input type="text" name="issued_by" placeholder="Issued By (Optional)">
            <input type="text" name="review" placeholder="Review Notes (Optional)" style="width: 200px;">
        </div>
        
        <button type="submit" style="padding: 5px 15px; cursor: pointer;">Submit Log</button>
    </form>

    <hr>

    <h2>Active Logs</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Timestamp</th>
                <th>Username</th>
                <th>SteamID</th>
                <th>Reason</th>
                <th>Duration (m)</th>
                <th>Server</th>
                <th>Issued By</th>
                <th>Review</th>
            </tr>
        </thead>
        <tbody id="log-table-body">
            {% for log in logs %}
                {% include 'partials/log_row.html' %}
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
